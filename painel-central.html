<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG Andrômeda — Centro de Comando</title>
    <meta name="theme-color" content="#050B18">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background: #050B18;
            color: #E0EFFF;
            min-height: 100vh;
            padding: 2rem 1rem;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2.5rem;
            font-size: 1.6rem;
            color: #82CFFF;
        }

        .grid-comando {
            display: grid;
            gap: 1rem;
        }

        .btn-comando {
            padding: 1.2rem;
            border: 2px solid #1E4A80;
            border-radius: 12px;
            background: #0A1930;
            color: #E0EFFF;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-comando:hover {
            background: #1E4A80;
            border-color: #82CFFF;
            transform: translateY(-2px);
        }

        .btn-comando:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="painel">
    <h1>🌌 QG ANDRÔMEDA — CENTRO DE COMANDO</h1>
    <div class="grid-comando">
        <button onclick="window.location='core/'" class="btn-comando">🧠 NÚCLEO CENTRAL</button>
        <button onclick="window.location='modules/biblioteca.html'" class="btn-comando">📚 BIBLIOTECA</button>
        <button onclick="window.location='modules/laboratorio.html'" class="btn-comando">🧪 LABORATÓRIO</button>
        <button onclick="window.location='core/seguranca.js'" class="btn-comando">🛡️ GUARDIÃO</button>
        <button onclick="window.location='data/'" class="btn-comando">💾 MEMÓRIA</button>
        <button onclick="window.location='index.html'" class="btn-comando">🏠 VOLTAR AO INÍCIO</button>
    </div>
</div>

</body>
</html>
